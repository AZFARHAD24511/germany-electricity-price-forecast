name: Daily Electricity Price Forecast

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-data-${{ github.run_id }}
          restore-keys: |
            raw-data-

      - name: Ensure data directories
        run: mkdir -p data/raw outputs/forecasts logs

      - name: Update data + run forecast
        run: python scripts/run_daily_forecast.py

      - name: Upload forecast artifact
        uses: actions/upload-artifact@v4
        with:
          name: forecast-${{ github.run_id }}
          path: outputs/forecasts/
          if-no-files-found: warn

      - name: Commit forecast output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p outputs/forecasts
          git add outputs/forecasts/*.csv || true
          if git diff --staged --quiet; then
            echo "No forecast changes to commit"
          else
            git commit -m "chore: daily forecast $(date -u +%Y-%m-%d)"
            git push
          fi
